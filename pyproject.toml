[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testforge"
description = "Mutation-guided test quality agent: LLM generates tests, mutation testing proves they catch bugs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["version"]
authors = [{ name = "Luz7818" }]
keywords = [
    "llm",
    "mutation-testing",
    "test-generation",
    "software-testing",
    "pytest",
    "openai-compatible",
    "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=8.0",
    "coverage>=7.4",
    "openai>=1.30",
]

[project.optional-dependencies]
# The two repo gates beyond pytest itself: pyflakes (static check) and
# coverage are listed here so a fresh clone can run every documented gate:
#   pip install -e .[dev]
# hypothesis is included so the property-based mock mode and its tests work
# out of the box in CI; `pip install -e .[property]` installs it alone.
# matplotlib is only used by experiments/plots.py (rendering result figures);
# keep it out of the core install: `pip install -e .[plots]` when you want graphs.
dev = [
    "pytest>=8.0",
    "pyflakes>=3.0",
    "coverage>=7.4",
    "hypothesis>=6.100",
]
property = [
    "hypothesis>=6.100",
]
plots = [
    "matplotlib>=3.8",
]

[project.scripts]
testforge = "testforge.cli:main"

[project.urls]
Homepage = "https://github.com/Luz7818/testforge"
Repository = "https://github.com/Luz7818/testforge"
Issues = "https://github.com/Luz7818/testforge/issues"
Changelog = "https://github.com/Luz7818/testforge/blob/main/CHANGELOG.md"
Reproducing = "https://github.com/Luz7818/testforge/blob/main/docs/REPRODUCE.md"

[tool.setuptools.packages.find]
include = ["testforge*"]

[tool.setuptools.package-data]
testforge = ["pricing.json"]

# Single source of truth for the version is testforge/__init__.py.
[tool.setuptools.dynamic]
version = { attr = "testforge.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
