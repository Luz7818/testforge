name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (validates packaging on ASCII paths)
        run: pip install -e .
      - name: Run test suite (unit + integration + mock e2e)
        run: python -m pytest tests/ -q
      - name: CLI smoke check
        run: |
          python -m testforge.cli targets
          python -m testforge.cli --version
